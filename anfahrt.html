<!DOCTYPE html>

<head>

<style>

<body>
<div style="min-height: 100vh; background: var(--color-bg); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 28px; flex-wrap: wrap; padding: 26px clamp(20px, 6vw, 80px); border-bottom: 1px solid var(--color-divider);">
    <a href="index.html" style="display: inline-flex; align-items: center;"><img src="logo/logo_schriftzug_seitlich_crop.png" alt="Milena &amp; Alex" style="height: 26px; width: auto; display: block;"></a>
    <div style="display: flex; gap: clamp(16px, 2.4vw, 34px); flex-wrap: wrap;">
      <a href="programm.html" style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-neutral-700);">Programm</a>
      <a href="anfahrt.html" style="font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700);">Anfahrt</a>
      <a href="unterkunft.html" style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-neutral-700);">Unterkunft</a>
      <a href="geschenke.html" style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-neutral-700);">Geschenke</a>
      <a href="brautpaar.html" style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-neutral-700);">Kontakte</a>

  </div>

  <div style="flex: 1; padding: clamp(40px, 6vw, 88px) clamp(20px, 6vw, 80px); position: relative; overflow: hidden; z-index: 0;">

    <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--color-accent-2-700);">Zwei Orte, ein Tag</div>
    <h1 style="font-size: clamp(34px, 4.6vw, 58px); line-height: 1.06; letter-spacing: -0.02em; margin: 18px 0 0;">Anfahrt</h1>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(20px, 3vw, 34px); margin-top: clamp(32px, 4vw, 56px); max-width: 1000px;">
      <div class="card elev-sm" style="background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: clamp(26px, 3vw, 40px);">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-accent-2-700);">Trauung &amp; Apéro</div>
        <h2 style="font-size: clamp(26px, 2.6vw, 34px); letter-spacing: -0.01em; margin: 14px 0 10px;">Muehle Arbon</h2>
        <p style="font-size: 18px; line-height: 1.6; color: var(--color-neutral-700); margin: 0;">Mühlestrasse 12, 9320 Stachen</p>
        <a href="https://www.google.com/maps/search/?api=1&amp;query=M%C3%BChlestrasse+12%2C+9320+Stachen" target="_blank" rel="noopener" style="display: inline-block; margin-top: 24px; font-size: 15px; font-weight: 500; color: var(--color-accent-700); border-bottom: 1px solid var(--color-accent-300); padding-bottom: 3px;">In Karten öffnen</a>
      </div>
      <div class="card elev-sm" style="background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: clamp(26px, 3vw, 40px);">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-accent-2-700);">Nachtessen</div>
        <h2 style="font-size: clamp(26px, 2.6vw, 34px); letter-spacing: -0.01em; margin: 14px 0 10px;">Hoher Hirschberg</h2>
        <p style="font-size: 18px; line-height: 1.6; color: var(--color-neutral-700); margin: 0;">Hohe Hirschbergstrasse 58, 9050 Appenzell</p>
        <a href="https://www.google.com/maps/search/?api=1&amp;query=Hohe+Hirschbergstrasse+58%2C+9050+Appenzell" target="_blank" rel="noopener" style="display: inline-block; margin-top: 24px; font-size: 15px; font-weight: 500; color: var(--color-accent-700); border-bottom: 1px solid var(--color-accent-300); padding-bottom: 3px;">In Karten öffnen</a>
      </div>
    </div>

    <figure style="border-radius: var(--radius-lg); overflow: hidden; margin-top: clamp(28px, 4vw, 48px); max-width: 1000px;">
      <img src="images/IMG_9837.JPEG" alt="Unterwegs" style="width: 100%; height: clamp(240px, 30vw, 380px); object-fit: cover;">

  <div style="background: var(--color-surface); padding: clamp(36px, 5vw, 64px) clamp(20px, 6vw, 80px); display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap;">
    <a href="index.html" style="display: inline-flex; align-items: center;"><img src="logo/logo_schriftzug_seitlich_crop.png" alt="Milena &amp; Alex" style="height: 26px; width: auto; display: block;"></a>
    <div style="font-size: 15px; color: var(--color-neutral-700);">29. Mai 2027 · Wir freuen uns auf euch</div>

</html>
