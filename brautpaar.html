<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brautpaar & Trauzeugen — Milena & Alex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; font-size: 17px; }
  html { scroll-behavior: smooth; }
  a { text-decoration: none; }
  a[href$=".html"]:hover, a[target="_blank"]:hover { color: var(--color-accent); }
</style>
</head>
<body>
<div style="min-height: 100vh; background: var(--color-bg); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 28px; flex-wrap: wrap; padding: 26px clamp(20px, 6vw, 80px); border-bottom: 1px solid var(--color-divider);">
    <a href="index.html" style="font-family: var(--font-heading); font-size: 19px; letter-spacing: 0.02em; color: var(--color-text);">Milena &amp; Alex</a>
    <div style="display: flex; gap: clamp(16px, 2.4vw, 34px); flex-wrap: wrap;">
      <a href="programm.html" style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-neutral-700);">Programm</a>
      <a href="anfahrt.html" style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-neutral-700);">Anfahrt</a>
      <a href="unterkunft.html" style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-neutral-700);">Unterkunft</a>

    </div>
  </div>

  <div style="flex: 1; padding: clamp(40px, 6vw, 88px) clamp(20px, 6vw, 80px);">
    <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--color-accent-2-700);">Wer euch begleitet</div>
    <h1 style="font-size: clamp(34px, 4.6vw, 58px); line-height: 1.06; letter-spacing: -0.02em; margin: 18px 0 0;">Brautpaar &amp; Trauzeugen</h1>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(32px, 5vw, 72px); align-items: start; margin-top: clamp(32px, 4vw, 56px); max-width: 1040px;">
      <div style="border: 1px dashed var(--color-neutral-400); border-radius: var(--radius-lg); padding: clamp(26px, 3vw, 40px);">
        <p style="font-family: ui-monospace, monospace; font-size: 14px; line-height: 1.7; color: var(--color-neutral-600); margin: 0;">Namen und Kontakte folgen — Brautpaar und Trauzeugen.</p>
      </div>
      <figure style="border-radius: var(--radius-lg); overflow: hidden;">
        <img class="washed" src="images/apero.jpg" alt="Milena und Alex" style="width: 100%; height: clamp(280px, 34vw, 420px); object-fit: cover;">
      </figure>
    </div>
  </div>

  <div style="background: var(--color-surface); padding: clamp(36px, 5vw, 64px) clamp(20px, 6vw, 80px); display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap;">
    <a href="index.html" style="font-family: var(--font-heading); font-size: clamp(24px, 3vw, 34px); letter-spacing: -0.01em; color: var(--color-text);">Milena &amp; Alex</a>

</html>
